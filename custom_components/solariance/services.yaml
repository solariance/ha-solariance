get_forecast:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solariance
    day:
      required: false
      selector:
        number:
          min: 0
          max: 13
          mode: box
    resolution:
      required: false
      default: hour
      selector:
        select:
          translation_key: resolution
          options:
            - hour
            - quarter_hour

find_surplus_window:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: solariance
    load_kw:
      required: true
      example: 2.0
      selector:
        number:
          min: 0.05
          max: 1000
          step: 0.05
          unit_of_measurement: kW
          mode: box
    duration_hours:
      required: false
      default: 2
      selector:
        number:
          min: 0.25
          max: 24
          step: 0.25
          unit_of_measurement: h
          mode: box
    baseline_kw:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 0.05
          unit_of_measurement: kW
          mode: box
    day:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 13
          mode: box
    electricity_price_eur_per_kwh:
      required: false
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          unit_of_measurement: EUR/kWh
          mode: box
    feed_in_tariff_eur_per_kwh:
      required: false
      selector:
        number:
          min: 0
          max: 5
          step: 0.001
          unit_of_measurement: EUR/kWh
          mode: box
